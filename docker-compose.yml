# IMPORTANT: This file contains PLACEHOLDER values.
# Before running `docker compose up`, fill in your real values for:
#   DISCORD_TOKEN, DISCORD_CLIENT_SECRET, SESSION_SECRET
# Keep your filled-in copy LOCAL — do NOT commit real secrets to the repo.

services:
  bot:
    image: ghcr.io/atvriders/discord-yt-music-bot:latest
    pull_policy: always
    environment:
      # Discord bot token
      DISCORD_TOKEN: "CHANGE_ME"

      # ── Additional bots (optional) ────────────────────────────────────────────────
      # Run more bots in this SAME container so each can play a different song in a different
      # voice channel. Each needs its OWN Discord application + bot token, invited to your server,
      # and a DISTINCT command prefix. The web panel gets a bot-picker to choose which one to control.
      # DISCORD_TOKEN_2: ""          # second bot's token (leave "" to disable)
      # COMMAND_PREFIX_2: "!"        # must NOT overlap another prefix — "?"/"?2" clash, so use "!", "$", …
      # BOT_NAME_2: "YouTube Music Bot 2"
      # For a third bot add DISCORD_TOKEN_3 / COMMAND_PREFIX_3 / BOT_NAME_3, and so on (contiguous).

      # Discord OAuth configuration
      DISCORD_CLIENT_ID: "your_client_id_here"
      DISCORD_CLIENT_SECRET: "CHANGE_ME"

      # Application URLs
      PUBLIC_BASE_URL: "http://localhost:8080"
      OAUTH_REDIRECT_URI: "http://localhost:8080/auth/callback"

      # Session and security
      SESSION_SECRET: "CHANGE_ME"

      # Admin user IDs (comma-separated Discord user IDs)
      ADMIN_USER_IDS: "123456789,987654321"

      # Server configuration
      PORT: "8080"
      HOST: "0.0.0.0"
      # Behind an HTTPS reverse proxy (Cloudflare tunnel, nginx, Traefik, …)? Set "true" —
      # otherwise the bot sees plain HTTP, won't set the secure session cookie, and OAuth
      # login fails with "invalid_state". Only leave "false" for DIRECT exposure (no proxy),
      # where it stops clients spoofing X-Forwarded-For to bypass the per-IP rate limiter.
      TRUST_PROXY: "false"

      # Logging
      LOG_LEVEL: "info"

      # Environment
      NODE_ENV: "production"

      # Cache configuration
      CACHE_DIR: "/data/cache"
      CACHE_MAX_MB: "5000"

      # Music player timeouts
      IDLE_TIMEOUT_SEC: "300"

      # History and search limits
      HISTORY_MAX_ITEMS: "100"
      SEARCH_RESULT_COUNT: "10"

      # Download configuration
      PREFETCH_DEPTH: "3"
      MAX_TRANSCODE_JOBS: "4"
      # Seeds the INITIAL per-guild "Max track length" (the panel overrides it per guild).
      # 14400 = 4h so long content (e.g. concerts) plays out-of-box; "" / 0 = no limit.
      MAX_TRACK_DURATION_SEC: "14400"

      # Audio processing — SponsorBlock trims non-song segments out before playback.
      #   music_offtopic = the NON-MUSIC parts of a music video (spoken intros/outros, skits);
      #   intro/outro = title cards & endcards; sponsor/selfpromo = ad reads.
      # Comma-separated; "" disables. Categories: https://wiki.sponsor.ajay.app/w/Segment_Categories
      SPONSORBLOCK_REMOVE: "sponsor,selfpromo,intro,outro,music_offtopic"
      NORMALIZE_LOUDNESS: "false"
      # Opus send bitrate (kbps, 32-510) for RE-ENCODED audio: seeking, crossfade/loudnorm/FX,
      # volume != 100, and SponsorBlock's non-opus conversions. HONEST NOTES:
      #  - The Opus-passthrough fast path is unaffected: an already-opus download plays untouched
      #    (best possible), so this can't exceed SOURCE quality — YouTube serves ~130-160k opus
      #    normally; a YouTube Premium account's cookies unlock 256k opus automatically.
      #  - Discord's voice-channel bitrate setting is a client-side hint; listeners receive what
      #    the BOT sends (this value on re-encode paths).
      #  - Higher = more listener downlink (~640 B/20ms packet at 256). Values near 510 can
      #    fragment on low-MTU links (VPN/PPPoE).
      #  - Older cached SponsorBlock conversions were made at 96k; clear the cache volume to
      #    re-download them at this quality.
      AUDIO_BITRATE_KBPS: "256"

      # YouTube configuration
      YT_PROXY: "" # optional residential/SOCKS proxy if your IP gets blocked by YouTube
      # ── Age-restricted (18+) cookies ──────────────────────────────────────────────────────
      # Most age-restricted videos already play WITHOUT cookies (the extraction ladder falls
      # through to the tv_embedded/mediaconnect bypass clients). You only need cookies from a
      # logged-in 18+ account for age-restricted videos whose uploader DISABLED embedding (also
      # helps on flagged/datacenter IPs). Export cookies.txt from a browser (extension: "Get
      # cookies.txt LOCALLY") in a private window on an 18+ account, then EITHER:
      #  (a) mount the file and give its path here:
      YT_COOKIES: "" # e.g. "/data/cookies.txt" — and add  - ./cookies.txt:/data/cookies.txt:ro  under volumes:
      #  (b) OR paste cookies inline (no file to mount) as a YAML block — accepts EITHER an
      #      exported cookies.txt (tab-separated) OR a one-line browser "Cookie:" header copied
      #      from DevTools (name=value; name=value; …), which is auto-converted. Keep the 2-space
      #      indent on every line. Leave it commented/unset to disable.
      # YT_COOKIES_TEXT: |
      #   # exported cookies.txt (TAB-separated):
      #   # Netscape HTTP Cookie File
      #   .youtube.com	TRUE	/	TRUE	1799999999	SID	<paste-value>
      #   # …or just one line: the whole browser Cookie header:
      #   # YSC=<v>; __Secure-1PSID=<v>; HSID=<v>; SID=<v>; …
      #  (c) OR — much less of a chore — turn on the COOKIE CONSOLE below and paste/import from
      #      the web panel at any time, with no redeploy. YT_COOKIES_TEXT is only the SEED: once
      #      a jar exists, yt-dlp keeps rotating it in place and this value is NOT re-applied on
      #      restart (it is re-applied only when you change it), so the session stays alive
      #      instead of resetting to a weeks-old paste every time the container comes up.

      # ── Cookie console (web panel → "Cookie console") ────────────────────────────────────
      # Its OWN password. UNSET = the console is OFF: every /api/cookies route 404s and the UI
      # never appears. Signing in to the panel only proves you share a server with the bot —
      # right for pause/skip, wrong for a tool that can replace the bot's Google session — so
      # this does not ride on the Discord login. Use a long random value.
      # Once set, open the panel, add #cookies to the URL, and unlock with this password.
      COOKIE_ADMIN_PASSWORD: "" # CHANGE_ME to enable the cookie console
      # The chromium sidecar's user-data-dir, inside the read-only mount below. linuxserver sets
      # HOME=/config and chromium defaults to $HOME/.config/chromium, so that dir is the one
      # holding "Default/Cookies". If an image update moves it, find the real one
      # (`docker compose exec chromium find /config -name Cookies`) and point this at its
      # user-data-dir. Empty = the Import button is simply off; paste still works.
      COOKIE_BROWSER_PROFILE: "/browser-profile/.config/chromium"
      # Zero-PO-token clients — reliable on most hosts. Only use "web,mweb" if you also run the
      # bgutil PO-token sidecar (`--profile pot`) and set PO_TOKEN_PROVIDER_URL below; otherwise
      # those clients silently fail to extract audio. (The bgutil yt-dlp plugin ships in the image.)
      YT_PLAYER_CLIENTS: "android_vr,web_embedded,tv"
      PO_TOKEN_PROVIDER_URL: "" # only set (e.g. http://bgutil-pot:4416) when running `--profile pot`
      # MUST match PUBLIC_BASE_URL exactly, or the live-updates WebSocket is rejected (no live panel)
      ALLOWED_WS_ORIGINS: "http://localhost:8080"
    ports: ["8080:8080"]
    volumes:
      - "cache:/data/cache"
      - "browser-profile:/browser-profile:ro" # the sidecar owns this profile; we only read it
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    profiles: ["pot"]
    restart: unless-stopped
    expose: ["4416"]

  # Optional sign-in browser: docker compose --profile browser up -d
  # Log into YouTube in it by hand (2FA works — a human is driving), then WAIT ~30s (chromium
  # commits cookies on a timer; closing the tab does not flush) or `docker compose stop chromium`,
  # then press "Import from browser" in the bot's cookie console, and take it down again:
  # docker compose --profile browser down
  # This is the ONLY way to get the HttpOnly auth cookies (SID / HSID / __Secure-1PSID); they are
  # not in `document.cookie`, so a DevTools copy-paste can never contain them.
  chromium:
    image: lscr.io/linuxserver/chromium:latest
    profiles: ["browser"]
    environment:
      PUID: "10001" # must match the bot's app uid — chromium's profile dir is mode 0700
      PGID: "10001"
      TZ: "Etc/UTC"
      CUSTOM_USER: "CHANGE_ME" # basic auth on the browser UI; not the cookie-console password
      PASSWORD: "CHANGE_ME"
      # --password-store=basic is not optional: with a keyring available chromium writes v11
      # cookies the bot cannot decrypt, and yt-dlp drops them SILENTLY — you get a jar that looks
      # fine and is missing exactly the auth cookies you signed in for. (The console warns when it
      # sees that happen.) The URL is the start page.
      CHROME_CLI: "--password-store=basic https://www.youtube.com/"
    # LAN-ONLY. Never publish on 0.0.0.0 and never route this through your tunnel/reverse proxy:
    # it is a logged-in Google session in a full browser behind one password. Substitute your
    # host's LAN address (LAN_IP=198.51.100.10 docker compose --profile browser up -d); the
    # default keeps it on loopback, reachable only over an SSH tunnel.
    # 3001 is the image's HTTPS listener (3000 is plain HTTP). The cert is self-signed, so you
    # WILL get a certificate warning on https://<LAN_IP>:8081 — accept it. Over plain HTTP on a
    # LAN IP the page is not a secure context, and WebCodecs — the desktop's video and audio —
    # is dead, which makes signing in to YouTube by hand miserable.
    ports: ["${LAN_IP:-127.0.0.1}:8081:3001"]
    volumes: ["browser-profile:/config"] # shared, read-write here / read-only in the bot
    shm_size: "1gb" # the image needs this for real sites (YouTube)
    mem_limit: 2g
    restart: "no" # a maintenance tool, not a service — up to sign in, then down

volumes:
  cache:
  browser-profile:
